<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 20px;
  }
  .quiz-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  h1 { text-align: center; }
  .question {
    font-weight: bold;
    margin: 20px 0 10px;
  }
  .options label {
    display: block;
    margin: 6px 0;
    padding: 8px;
    border-radius: 6px;
    background: #eef;
    cursor: pointer;
    transition: background 0.2s;
  }
  .options input[type="radio"] { margin-right: 8px; }
  .options label:hover { background: #dde; }
  button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Physics Lesson 1 Quiz</h1>
  <form id="quizForm">
    <!-- Questions will be inserted here by JS -->
  </form>
  <button type="button" onclick="checkAnswers()">Submit</button>
  <div id="result"></div>
  <button class="quizButton" onclick="location.href='../index.html'">Go Back</button>
</div>

<script>
// Example question set; you can load this from a JSON file or database
const questions = [
  {
    q: "1. What law in the Philippines addresses legal issues concerning online interactions and the Internet?",
    options: [
      "Republic Act No. 9995",
      "Republic Act No. 10175",
      "Republic Act No. 1425",
      "Republic Act No. 9003"
    ],
    answer: 1
  },
  {
    q: "2. Which of the following is an example of the influence of media on the economy?",
    options: [
      "People basing beauty on physical appearance",
      "Online shopping through Shopee and Lazada",
      "Textklamo hotline for citizen journalism",
      "Teachers using PowerPoint presentations"
    ],
    answer: 1
  },
  {
    q: "3. What is the purpose of the Cybercrime Prevention Act of 2012?",
    options: [
      "To promote online shopping",
      "To regulate political advertisements",
      "To address legal issues concerning online interactions",
      "To support citizen journalism"
    ],
    answer: 2
  },
  {
    q: "4. What term refers to obtaining someone’s personal or financial information to commit fraud?",
    options: [
      "Cyber-squatting",
      "Phishing",
      "Identity theft",
      "Libel"
    ],
    answer: 2
  },
  {
    q: "5. Which example best shows the role of media in education?",
    options: [
      "People using social media to report crimes",
      "Using Google Classroom for online learning",
      "Posting about political campaigns",
      "Streaming K-pop songs on YouTube"
    ],
    answer: 1
  },
  {
    q: "6. What does 'cybersex' refer to according to the Cybercrime Prevention Act?",
    options: [
      "Using fake social media accounts",
      "Engaging in lascivious acts through a computer system",
      "Spreading false information online",
      "Taking photos without consent"
    ],
    answer: 1
  },
  {
    q: "7. Which law penalizes photo or video voyeurism?",
    options: [
      "Republic Act No. 10175",
      "Republic Act No. 9995",
      "Republic Act No. 1425",
      "Republic Act No. 8484"
    ],
    answer: 1
  },
  {
    q: "8. What is an example of citizen journalism?",
    options: [
      "Posting selfies on Instagram",
      "Sending reports through Textklamo hotline",
      "Downloading movies online",
      "Sharing memes on Facebook"
    ],
    answer: 1
  },
  {
    q: "9. What is 'cyber-squatting'?",
    options: [
      "Creating fake news websites",
      "Acquiring a domain name in bad faith to profit or mislead",
      "Using online learning platforms",
      "Defaming others online"
    ],
    answer: 1
  },
  {
    q: "10. Which of the following best shows media’s influence on society?",
    options: [
      "Students enrolling in Massive Open Online Courses",
      "People reporting local problems on social media",
      "Government agencies posting announcements online",
      "TV commercials shaping beauty standards"
    ],
    answer: 3
  }
];


const form = document.getElementById("quizForm");

questions.forEach((item, index) => {
  const questionDiv = document.createElement("div");
  questionDiv.className = "question-block";
  questionDiv.innerHTML = `
    <div class="question">${item.q}</div>
    <div class="options">
      ${item.options.map((opt,i)=>`
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opt}
        </label>`).join("")}
    </div>
  `;
  form.appendChild(questionDiv);
});

function checkAnswers() {
  let score = 0;
  questions.forEach((item, idx) => {
    const chosen = form[`q${idx}`].value;
    if (parseInt(chosen) === item.answer) score++;
  });
  document.getElementById("result").textContent =
    `You got ${score} out of ${questions.length} correct.`;
}
</script>

</body>
</html>
