<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 20px;
  }
  .quiz-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  h1 { text-align: center; }
  .question {
    font-weight: bold;
    margin: 20px 0 10px;
  }
  .options label {
    display: block;
    margin: 6px 0;
    padding: 8px;
    border-radius: 6px;
    background: #eef;
    cursor: pointer;
    transition: background 0.2s;
  }
  .options input[type="radio"] { margin-right: 8px; }
  .options label:hover { background: #dde; }
  button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 20px;
  }
  .correct {
    background-color: #c8f7c5 !important; /* soft green */
    border: 1px solid #27ae60;
  }

  .wrong {
    background-color: #f7c5c5 !important; /* soft red */
    border: 1px solid #c0392b;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Philosophy Lesson 1 Test</h1>
  <form id="quizForm">
    <!-- Questions will be inserted here by JS -->
  </form>
  <button type="button" onclick="checkAnswers()">Submit</button>
  <div id="result"></div>
  <button class="quizButton" onclick="location.href='../index.html'">Go Back</button>
</div>

<script>
// Example question set; you can load this from a JSON file or database
const questions = [
  {
    q: "1. Which of the following best describes self-determination?",
    options: [
      "The ability to imitate others’ actions",
      "The capability to make choices and regulate one’s own actions",
      "The tendency to follow instincts and impulses",
      "The refusal to make any decisions"
    ],
    answer: 1
  },
  {
    q: "2. What sets human beings apart from animals according to the lesson?",
    options: [
      "Humans act purely on instinct",
      "Humans can choose and decide freely",
      "Humans cannot resist commands",
      "Humans rely on conditioning"
    ],
    answer: 1
  },
  {
    q: "3. How do animals usually act according to the text?",
    options: [
      "Based on critical thinking",
      "According to predetermined responses or instincts",
      "By making moral choices",
      "Through reason and reflection"
    ],
    answer: 1
  },
  {
    q: "4. What is the main indication of human freedom?",
    options: [
      "The ability to feel emotions",
      "The ability to make choices and perform actions",
      "The ability to follow rules strictly",
      "The ability to adapt physically"
    ],
    answer: 1
  },
  {
    q: "5. Which type of freedom refers to the absence of physical restraint?",
    options: [
      "Psychological freedom",
      "Moral freedom",
      "Physical freedom",
      "Intellectual freedom"
    ],
    answer: 2
  },
  {
    q: "6. What is another term for psychological freedom?",
    options: [
      "Freedom of speech",
      "Freedom of choice",
      "Freedom of movement",
      "Freedom from rules"
    ],
    answer: 1
  },
  {
    q: "7. What does moral freedom emphasize?",
    options: [
      "Using freedom to uphold human dignity and goodness",
      "Doing whatever one pleases without limits",
      "Obeying orders without thinking",
      "Avoiding moral responsibility"
    ],
    answer: 0
  },
  {
    q: "8. When does a person become less free according to the text?",
    options: [
      "When he or she follows moral standards",
      "When he or she uses freedom in a bad way",
      "When he or she respects human dignity",
      "When he or she makes careful choices"
    ],
    answer: 1
  },
  {
    q: "9. What does the example of the dog fetching a ball illustrate?",
    options: [
      "That animals act based on freedom of choice",
      "That animals act instinctively or through conditioning",
      "That humans are less free than animals",
      "That both humans and animals have equal freedom"
    ],
    answer: 1
  },
  {
    q: "10. Which statement best describes moral responsibility in freedom?",
    options: [
      "Freedom allows a person to act without consequences",
      "Freedom should always be guided by truth and goodness",
      "Freedom means avoiding all forms of control",
      "Freedom is only about following one’s desires"
    ],
    answer: 1
  }
];


const form = document.getElementById("quizForm");

questions.forEach((item, index) => {
  const questionDiv = document.createElement("div");
  questionDiv.className = "question-block";
  questionDiv.innerHTML = `
    <div class="question">${item.q}</div>
    <div class="options">
      ${item.options.map((opt,i)=>`
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opt}
        </label>`).join("")}
    </div>
  `;
  form.appendChild(questionDiv);
});

function checkAnswers() {
  let score = 0;

  questions.forEach((item, idx) => {
    const options = form.querySelectorAll(`input[name="q${idx}"]`);
    let chosenIndex = null;

    options.forEach((opt, i) => {
      const label = opt.parentElement;
      label.classList.remove("correct", "wrong");

      if (opt.checked) chosenIndex = i;

      if (i === item.answer) {
        label.classList.add("correct");
      }
    });

    if (chosenIndex !== null && chosenIndex !== item.answer) {
      options[chosenIndex].parentElement.classList.add("wrong");
    }

    if (parseInt(chosenIndex) === item.answer) score++;
  });

  document.getElementById("result").textContent =
    `You got ${score} out of ${questions.length} correct.`;
}
</script>

</body>
</html>
