<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 20px;
  }
  .quiz-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  h1 { text-align: center; }
  .question {
    font-weight: bold;
    margin: 20px 0 10px;
  }
  .options label {
    display: block;
    margin: 6px 0;
    padding: 8px;
    border-radius: 6px;
    background: #eef;
    cursor: pointer;
    transition: background 0.2s;
  }
  .options input[type="radio"] { margin-right: 8px; }
  .options label:hover { background: #dde; }
  button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 20px;
  }
  .correct {
    background-color: #c8f7c5 !important; /* soft green */
    border: 1px solid #27ae60;
  }

  .wrong {
    background-color: #f7c5c5 !important; /* soft red */
    border: 1px solid #c0392b;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>MIL Lesson 3 Test</h1>
  <form id="quizForm">
    <!-- Questions will be inserted here by JS -->
  </form>
  <button type="button" onclick="checkAnswers()">Submit</button>
  <div id="result"></div>
  <button class="quizButton" onclick="location.href='../index.html'">Go Back</button>
</div>

<script>
// Example question set; you can load this from a JSON file or database
const questions = [
  {
    q: "1. What is the main goal of media literacy?",
    options: [
      "To restrict the use of media",
      "To critically analyze and create media responsibly",
      "To promote social media entertainment",
      "To discourage media consumption"
    ],
    answer: 1
  },
  {
    q: "2. Which of the following is a key tip for being media and information literate?",
    options: [
      "Share posts immediately",
      "Ignore the source",
      "Verify information before sharing",
      "Avoid reading long articles"
    ],
    answer: 2
  },
  {
    q: "3. What is one tool that Facebook for Business provides?",
    options: [
      "Analytics",
      "Shopping Tags",
      "TweetDeck",
      "Video Calls"
    ],
    answer: 0
  },
  {
    q: "4. What feature does Instagram use to highlight products in Stories and posts?",
    options: [
      "Ad Manager",
      "Business Account",
      "Shopping Tags",
      "Analytics"
    ],
    answer: 2
  },
  {
    q: "5. Which Twitter tool is used to monitor multiple accounts and timelines?",
    options: [
      "TweetDeck",
      "Messenger",
      "Pages",
      "Ad Manager"
    ],
    answer: 0
  },
  {
    q: "6. Which of the following is an advantage of media and information to education?",
    options: [
      "Tempts people to buy unnecessary items",
      "Improves the quality of education and motivates learners",
      "Leads to addiction to social media",
      "Encourages spreading fake news"
    ],
    answer: 1
  },
  {
    q: "7. What is a disadvantage of media and information in politics?",
    options: [
      "Educates citizens on political issues",
      "Can be used to manipulate news for propaganda",
      "Promotes transparency in government",
      "Allows citizens to express opinions"
    ],
    answer: 1
  },
  {
    q: "8. Which of the following is an advantage of media in the economy?",
    options: [
      "Can cause chaos through false reports",
      "Can promote tourism and attract investors",
      "Can distract workers from tasks",
      "Can misinform the public about policies"
    ],
    answer: 1
  },
  {
    q: "9. What is an example of how media benefits society?",
    options: [
      "Encourages productive hobbies and advocacy groups",
      "Promotes materialism and worldliness",
      "Distracts people from their work",
      "Causes addiction to social media"
    ],
    answer: 0
  },
  {
    q: "10. Which statement best describes a media literate individual?",
    options: [
      "Shares all online content freely",
      "Reads and verifies information before sharing",
      "Believes everything seen online",
      "Avoids using social media completely"
    ],
    answer: 1
  }
];


const form = document.getElementById("quizForm");

questions.forEach((item, index) => {
  const questionDiv = document.createElement("div");
  questionDiv.className = "question-block";
  questionDiv.innerHTML = `
    <div class="question">${item.q}</div>
    <div class="options">
      ${item.options.map((opt,i)=>`
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opt}
        </label>`).join("")}
    </div>
  `;
  form.appendChild(questionDiv);
});

function checkAnswers() {
  let score = 0;

  questions.forEach((item, idx) => {
    const options = form.querySelectorAll(`input[name="q${idx}"]`);
    let chosenIndex = null;

    options.forEach((opt, i) => {
      const label = opt.parentElement;
      label.classList.remove("correct", "wrong");

      if (opt.checked) chosenIndex = i;

      if (i === item.answer) {
        label.classList.add("correct");
      }
    });

    if (chosenIndex !== null && chosenIndex !== item.answer) {
      options[chosenIndex].parentElement.classList.add("wrong");
    }

    if (parseInt(chosenIndex) === item.answer) score++;
  });

  document.getElementById("result").textContent =
    `You got ${score} out of ${questions.length} correct.`;
}
</script>

</body>
</html>
