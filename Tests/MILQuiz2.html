<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 20px;
  }
  .quiz-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  h1 { text-align: center; }
  .question {
    font-weight: bold;
    margin: 20px 0 10px;
  }
  .options label {
    display: block;
    margin: 6px 0;
    padding: 8px;
    border-radius: 6px;
    background: #eef;
    cursor: pointer;
    transition: background 0.2s;
  }
  .options input[type="radio"] { margin-right: 8px; }
  .options label:hover { background: #dde; }
  button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>MIL Lesson 2 Test</h1>
  <form id="quizForm">
    <!-- Questions will be inserted here by JS -->
  </form>
  <button type="button" onclick="checkAnswers()">Submit</button>
  <div id="result"></div>
  <button class="quizButton" onclick="location.href='../index.html'">Go Back</button>
</div>

<script>
// Example question set; you can load this from a JSON file or database
const questions = [
  {
    q: "1. What does MOOC stand for?",
    options: [
      "Massive Open Online Course",
      "Modern Online Open Classroom",
      "Managed Online Organized Course",
      "Massive Online Open Curriculum"
    ],
    answer: 0
  },
  {
    q: "2. Which of the following is NOT a characteristic of MOOCs?",
    options: [
      "Massive enrollment",
      "Open access to anyone",
      "Requires physical attendance",
      "Online-based learning"
    ],
    answer: 2
  },
  {
    q: "3. What device is an example of wearable technology that tracks fitness activities?",
    options: [
      "Smartwatch",
      "Desktop computer",
      "Projector",
      "Printer"
    ],
    answer: 0
  },
  {
    q: "4. Which wearable technology links up with your phone and can take photographs?",
    options: [
      "Smartglasses",
      "Fitness tracker",
      "Hearables",
      "VR headset"
    ],
    answer: 0
  },
  {
    q: "5. What does a VR headset primarily do?",
    options: [
      "Allows users to view 3D movies only",
      "Shows a computer-generated virtual environment",
      "Tracks a person’s heartbeat",
      "Projects holographic images in real life"
    ],
    answer: 1
  },
  {
    q: "6. What does 'ubiquitous learning' mean?",
    options: [
      "Learning only inside the classroom",
      "Learning anytime, anywhere, with anyone",
      "Learning through printed books",
      "Learning only with mobile phones"
    ],
    answer: 1
  },
  {
    q: "7. Which of the following best describes a paperless society?",
    options: [
      "A society that uses more books",
      "A society that relies on digital and electronic transactions",
      "A society that avoids using technology",
      "A society that promotes handwritten letters"
    ],
    answer: 1
  },
  {
    q: "8. What technology allows digital designs to be physically produced layer by layer?",
    options: [
      "3D printing",
      "Virtual reality",
      "Augmented reality",
      "Holography"
    ],
    answer: 0
  },
  {
    q: "9. Which of the following is NOT an example of wearable technology?",
    options: [
      "VR headset",
      "Smartwatch",
      "Fitness tracker",
      "Desktop computer"
    ],
    answer: 3
  },
  {
    q: "10. What is one major challenge of going paperless in the Philippines?",
    options: [
      "Lack of electricity and Internet access in some areas",
      "Lack of people interested in technology",
      "Too much use of plastic materials",
      "Government ban on digital transactions"
    ],
    answer: 0
  }
];

const form = document.getElementById("quizForm");

questions.forEach((item, index) => {
  const questionDiv = document.createElement("div");
  questionDiv.className = "question-block";
  questionDiv.innerHTML = `
    <div class="question">${item.q}</div>
    <div class="options">
      ${item.options.map((opt,i)=>`
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opt}
        </label>`).join("")}
    </div>
  `;
  form.appendChild(questionDiv);
});

function checkAnswers() {
  let score = 0;
  questions.forEach((item, idx) => {
    const chosen = form[`q${idx}`].value;
    if (parseInt(chosen) === item.answer) score++;
  });
  document.getElementById("result").textContent =
    `You got ${score} out of ${questions.length} correct.`;
}
</script>

</body>
</html>
